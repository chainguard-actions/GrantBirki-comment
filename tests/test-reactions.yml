name: Test comment with reactions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test adding reactions to a comment (with a body)
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-act-testing
          repository: octocat/Hello-World
          issue-number: "1"
          body: "Reacting to this comment!"
          reactions: "+1, rocket"
          reactions-edit-mode: append

      - name: Assert action ran with reactions input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
