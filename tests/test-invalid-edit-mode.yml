name: Test invalid edit-mode fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token
          repository: owner/repo
          issue-number: "1"
          body: "Hello world"
          edit-mode: invalid-mode
      - name: Assert action failed with invalid edit-mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid edit-mode, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid edit-mode"
