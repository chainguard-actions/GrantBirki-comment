name: Test body and file conflict fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a template file
        run: |
          echo "Hello from template" > /tmp/comment-template.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token
          repository: owner/repo
          issue-number: "1"
          body: "Hello world"
          file: /tmp/comment-template.md
      - name: Assert action failed when both body and file provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when both body and file provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when both body and file provided"
