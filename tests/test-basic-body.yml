name: Test basic comment with body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a valid GitHub token and issue number to post a comment.
      # Under act, we verify the action is invoked and produces an error (or succeeds)
      # rather than silently misconfiguring. We use a dummy token and issue number
      # to confirm the action starts up and attempts the API call.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-act-testing
          repository: octocat/Hello-World
          issue-number: "1"
          body: "Hello from act test!"

      - name: Assert action ran (outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert comment-id output is present on success or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMENT_ID: ${{ steps.action.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          # With a fake token the API call will fail; that is expected.
          # We just confirm the action ran and produced a deterministic outcome.
          if [ "$OUTCOME" = "success" ] && [ -z "$COMMENT_ID" ]; then
            echo "FAIL: action succeeded but comment-id output was empty"
            exit 1
          fi
          echo "PASS"
