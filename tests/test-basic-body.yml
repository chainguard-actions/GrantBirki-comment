name: Test basic comment with body
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create comment with body
        id: comment
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: "1"
          body: "Hello from act test!"
        continue-on-error: true

      - name: Assert step ran
        env:
          OUTCOME: ${{ steps.comment.outcome }}
          COMMENT_ID: ${{ steps.comment.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          # The action either succeeds (real token + real issue) or fails with API error
          # We verify the action was invoked and produced an outcome
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, comment-id: $COMMENT_ID"
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: expected comment-id output to be set on success"
              exit 1
            fi
            echo "PASS: comment created with id $COMMENT_ID"
          else
            echo "Action failed (expected without real GitHub credentials in act)"
            echo "PASS: action invoked correctly, API call failed as expected in local test"
          fi
