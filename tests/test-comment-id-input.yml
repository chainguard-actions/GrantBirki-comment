name: Test comment-id input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token
          repository: owner/repo
          issue-number: "1"
          comment-id: "123456789"
          body: "Updated comment body"
          edit-mode: replace
      - name: Assert action ran (input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail due to fake token / API call, but it must have
          # started and processed the comment-id input (not errored on input validation).
          # We accept either success or failure — just not a missing/skipped step.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with comment-id input (outcome: $OUTCOME)"
