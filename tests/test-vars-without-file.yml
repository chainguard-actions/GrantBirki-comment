name: Test vars without file fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token
          repository: owner/repo
          issue-number: "1"
          vars: "key: value"
      - name: Assert action failed when vars provided without file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when vars provided without file, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when vars provided without file"
