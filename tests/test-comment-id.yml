name: Test comment with comment-id (update existing)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update comment by comment-id
        id: comment
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: "1"
          comment-id: "123456789"
          body: "Updated comment content via comment-id"
          edit-mode: replace
        continue-on-error: true

      - name: Assert step ran
        env:
          OUTCOME: ${{ steps.comment.outcome }}
          COMMENT_ID: ${{ steps.comment.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          # The action either succeeds (real token + real comment) or fails with API error
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, comment-id: $COMMENT_ID"
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: expected comment-id output to be set on success"
              exit 1
            fi
            echo "PASS: comment updated with id $COMMENT_ID"
          else
            echo "Action failed (expected without real GitHub credentials in act)"
            echo "PASS: action invoked correctly with comment-id input, API call failed as expected in local test"
          fi
