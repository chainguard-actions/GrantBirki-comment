name: Test basic comment creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run comment action (expect API failure with fake token)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository: octocat/Hello-World
          issue-number: "1"
          body: "Hello from act test!"

      - name: Assert action ran and failed at API level (not config level)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid token (API error),
          # not because of missing inputs or misconfiguration.
          # A failure here means the action at least loaded and attempted the API call.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (API call with fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (maybe a mock environment)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
