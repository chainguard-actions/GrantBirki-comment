name: Test deprecated reaction-type input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Test action with deprecated reaction-type input (expect failure with invalid token)
        id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository: octocat/Hello-World
          issue-number: "1"
          body: "Testing deprecated reaction-type input"
          reaction-type: "+1"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert action failed or succeeded (not an unexpected state)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed (expected with fake token)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
