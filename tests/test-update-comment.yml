name: Test update existing comment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test updating an existing comment by providing a comment-id.
      # With a fake token the API call will fail, but we verify the action
      # starts up and processes the edit-mode and append-separator inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-act-testing
          repository: octocat/Hello-World
          issue-number: "1"
          comment-id: "123456789"
          body: "Appended content"
          edit-mode: append
          append-separator: newline

      - name: Assert action ran with update inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      # Test replace edit-mode
      - id: action-replace
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-act-testing
          repository: octocat/Hello-World
          issue-number: "1"
          comment-id: "123456789"
          body: "Replaced content"
          edit-mode: replace

      - name: Assert replace mode action ran
        env:
          OUTCOME: ${{ steps.action-replace.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
