name: Test comment with file template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create comment using file template
        id: comment
        uses: .
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: "1"
          file: "${{ github.workspace }}/actions/hardened/GrantBirki--comment/v2.0.10/tests/fixtures/template.md"
        continue-on-error: true

      - name: Assert step ran
        env:
          OUTCOME: ${{ steps.comment.outcome }}
          COMMENT_ID: ${{ steps.comment.outputs.comment-id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "comment-id: $COMMENT_ID"
          # The action either succeeds (real token + real issue) or fails with API error
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, comment-id: $COMMENT_ID"
            if [ -z "$COMMENT_ID" ]; then
              echo "FAIL: expected comment-id output to be set on success"
              exit 1
            fi
            echo "PASS: comment created from file template, id: $COMMENT_ID"
          else
            echo "Action failed (expected without real GitHub credentials in act)"
            echo "PASS: action invoked correctly with file input, API call failed as expected in local test"
          fi
